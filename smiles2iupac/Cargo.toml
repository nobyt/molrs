[package]
name = "smiles2iupac"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SMILES to IUPAC 2013 preferred name converter (Rust port)"

[dependencies]
molrs = { path = "../molrs" }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = "1"

[[bin]]
name = "smiles2iupac"
path = "src/main.rs"
